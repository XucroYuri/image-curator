[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "image-curator"
version = "0.1.0"
description = "Resource-aware, resumable, metadata-first curation for large image libraries"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "image-curator contributors" }]
keywords = ["image", "curation", "metadata", "computer-vision", "deduplication"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
numerics = [
  "numpy>=1.26",
]
siglip = [
  "numpy>=1.26",
  "torch>=2.2",
  "transformers>=4.40",
]
vlm = [
  "openai>=1.40",
]
inference = [
  "numpy>=1.26",
  "torch>=2.2",
  "transformers>=4.40",
  "openai>=1.40",
]

[project.urls]
Homepage = "https://github.com/XucroYuri/image-curator"
Repository = "https://github.com/XucroYuri/image-curator"
Issues = "https://github.com/XucroYuri/image-curator/issues"

[project.scripts]
image-curator = "image_curator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/image_curator"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["models", "curation-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP035", "UP037", "B905"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
